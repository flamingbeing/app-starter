<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Starter app</title>
  <script type="importmap">
{
  "imports": {
    "@core/app": "https://core.anawj.com/sync/1.0.0/app.js",
    "@core/auth": "https://core.anawj.com/sync/1.0.0/auth.js",
    "@core/sync": "https://core.anawj.com/sync/1.0.0/sync.js",
    "@core/update": "https://core.anawj.com/sync/1.0.0/update.js",
    "@core/ui": "./ui/index.js",
    "@core/theme": "./theme/index.js",
    "app-update/register.js": "https://core.anawj.com/update/0.2.0/register.js",
    "firebase/app": "./vendor/firebase/12.19.0/firebase-app.js",
    "firebase/auth": "./vendor/firebase/12.19.0/firebase-auth.js",
    "firebase/firestore": "./vendor/firebase/12.19.0/firebase-firestore.js"
  }
}
  </script>
  <script type="module" src="src/boot.js"></script>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://design.flamingbeing.com/v1/tokens.css">
  <link rel="stylesheet" href="theme/theme.css">
  <link rel="stylesheet" href="ui/ui.css">
  <link rel="stylesheet" href="app.css">
  <script type="module" src="src/app.js"></script>
</head>
<body>
  <header class="bar">
    <h1>Starter app</h1>
    <span id="sync-chip"></span>
  </header>
  <main>
    <section id="signed-out" hidden>
      <p>Sign in to see the list.</p>
      <div id="sign-in-sheet"></div>
    </section>
    <section id="no-access" hidden>
      <p>This account has no access yet. Ask an admin to add it.</p>
      <p class="small">Account id: <code id="uid"></code></p>
    </section>
    <section id="not-set-up" hidden>
      <p>This app isn't connected to its Firebase project yet (see README, "Fill").</p>
    </section>
    <section id="list-view" hidden>
      <div id="conflict-sheet"></div>
      <div id="refused-list"></div>
      <p id="edit-msg" class="small" role="status"></p>
      <form id="add" autocomplete="off">
        <label for="new-text">New item</label>
        <div class="row">
          <input id="new-text" name="text" maxlength="500" required>
          <button type="submit">Add</button>
        </div>
      </form>
      <ul id="items" aria-label="Items"></ul>
      <div id="empty"></div>
    </section>
  </main>
  <footer>
    <span id="who"></span>
    <button id="sign-out" type="button" hidden>Sign out</button>
    <p id="sign-out-msg" class="error" role="alert"></p>
    <div id="update-prompt"></div>
    <div id="theme-switch"></div>
  </footer>

  <div id="toasts"></div>

  <dialog id="edit" aria-labelledby="edit-title">
    <form method="dialog" id="edit-form">
      <h2 id="edit-title">Edit item</h2>
      <label for="edit-text">Text</label>
      <input id="edit-text" maxlength="500" required>
      <p id="edit-live" class="small" role="status"></p>
      <div class="row">
        <button id="edit-save" value="save">Save</button>
        <button id="edit-delete" value="delete" type="button" class="danger">Delete</button>
        <button value="cancel" formnovalidate>Cancel</button>
      </div>
    </form>
  </dialog>
</body>
</html>
